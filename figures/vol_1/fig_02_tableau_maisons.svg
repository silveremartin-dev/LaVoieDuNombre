<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect width="600" height="240" fill="#f8fafc" rx="8"/>
  <text x="300" y="32" text-anchor="middle" font-family="Liberation Sans" font-size="16" font-weight="bold" fill="#0f172a">Le Tableau des Maisons de Numération</text>
  
  <!-- Table Header -->
  <rect x="70" y="55" width="230" height="45" fill="#1d4ed8" rx="6"/>
  <text x="185" y="78" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#ffffff">Dizaines (d)</text>
  <text x="185" y="93" text-anchor="middle" font-family="Liberation Sans" font-size="11" fill="#e0e7ff">(Paquets de 10)</text>
  
  <rect x="305" y="55" width="225" height="45" fill="#15803d" rx="6"/>
  <text x="417" y="78" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#ffffff">Unités (u)</text>
  <text x="417" y="93" text-anchor="middle" font-family="Liberation Sans" font-size="11" fill="#dcfce7">(Cailloux isolés)</text>
  
  <!-- Row 1: 14 -->
  <rect x="70" y="105" width="230" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="185" y="137" text-anchor="middle" font-family="Liberation Sans" font-size="22" font-weight="bold" fill="#1d4ed8">1</text>
  
  <rect x="305" y="105" width="225" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="417" y="137" text-anchor="middle" font-family="Liberation Sans" font-size="22" font-weight="bold" fill="#15803d">4</text>
  <text x="540" y="137" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#475569">→  10 + 4 = 14</text>
  
  <!-- Row 2: 41 -->
  <rect x="70" y="160" width="230" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="185" y="192" text-anchor="middle" font-family="Liberation Sans" font-size="22" font-weight="bold" fill="#1d4ed8">4</text>
  
  <rect x="305" y="160" width="225" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="417" y="192" text-anchor="middle" font-family="Liberation Sans" font-size="22" font-weight="bold" fill="#15803d">1</text>
  <text x="540" y="192" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#475569">→  40 + 1 = 41</text>
</svg>