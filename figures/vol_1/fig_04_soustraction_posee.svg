<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="100%" height="180">
  <rect width="340" height="180" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="15" y="12" width="310" height="28" rx="4" fill="#eff6ff"/>
  <text x="170" y="31" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Soustraction posée avec retenue</text>
  <g transform="translate(85, 48)" font-family="Liberation Mono, Courier, monospace" font-size="20" font-weight="bold" fill="#0f172a">
    <text x="30" y="25">d   u</text>
    <text x="30" y="49">8   5</text>
    <text x="30" y="73">-   3   8</text>
    <line x1="0" y1="92" x2="160" y2="92" stroke="#0f172a" stroke-width="2"/>
    <text x="30" y="102">4   7</text>
  </g>
  <text x="170" y="165" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">15 - 8 = 7 unités, 8 - (3 + 1) = 4 dizaines</text>
