<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="100%" height="100%">
  <rect width="600" height="180" fill="#f8fafc" rx="8"/>
  <text x="300" y="28" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#0f172a">La Soustraction Concrète : Le Renard Voleur</text>
  
  <!-- Left: 7 fish -->
  <rect x="30" y="45" width="165" height="110" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="112" y="68" text-anchor="middle" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#1d4ed8">Les 7 Poissons Pêchés</text>
  <g transform="translate(45, 80)">
    <circle cx="15" cy="10" r="8" fill="#1d4ed8"/><circle cx="45" cy="10" r="8" fill="#1d4ed8"/><circle cx="75" cy="10" r="8" fill="#1d4ed8"/><circle cx="105" cy="10" r="8" fill="#1d4ed8"/><circle cx="15" cy="35" r="8" fill="#1d4ed8"/><circle cx="45" cy="35" r="8" fill="#1d4ed8"/><circle cx="75" cy="35" r="8" fill="#1d4ed8"/>
  </g>
  <text x="112" y="145" text-anchor="middle" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#1d4ed8">Quantité initiale : 7</text>
  
  <text x="215" y="105" text-anchor="middle" font-family="Liberation Sans" font-size="26" font-weight="bold" fill="#b91c1c">−</text>
  
  <!-- Center: 2 stolen -->
  <rect x="235" y="45" width="140" height="110" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" rx="6"/>
  <text x="305" y="68" text-anchor="middle" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#b91c1c">Volés (−2)</text>
  <g transform="translate(265, 85)">
    <circle cx="20" cy="10" r="8" fill="#b91c1c"/>
    <circle cx="55" cy="10" r="8" fill="#b91c1c"/>
    <line x1="12" y1="2" x2="28" y2="18" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="47" y1="2" x2="63" y2="18" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <text x="305" y="145" text-anchor="middle" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#b91c1c">Retrait : 2</text>
  
  <text x="395" y="105" text-anchor="middle" font-family="Liberation Sans" font-size="26" font-weight="bold" fill="#0f172a">═</text>
  
  <!-- Right: 5 remaining -->
  <rect x="415" y="45" width="155" height="110" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" rx="6"/>
  <text x="492" y="68" text-anchor="middle" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#15803d">Ce qui Reste</text>
  <g transform="translate(435, 80)">
    <circle cx="15" cy="10" r="8" fill="#15803d"/><circle cx="45" cy="10" r="8" fill="#15803d"/><circle cx="75" cy="10" r="8" fill="#15803d"/><circle cx="15" cy="35" r="8" fill="#15803d"/><circle cx="45" cy="35" r="8" fill="#15803d"/>
  </g>
  <text x="492" y="145" text-anchor="middle" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#15803d">Reste : 5</text>
</svg>