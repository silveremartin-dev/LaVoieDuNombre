  <rect x="280" y="145" width="90" height="40" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="325" y="171" text-anchor="middle" font-family="Liberation Sans" font-size="16" font-weight="bold" fill="#15803d">4</text>
