  <rect x="230" y="95" width="90" height="40" fill="#ffffff" stroke="#475569" stroke-width="1.5" rx="4"/>
  <text x="275" y="121" text-anchor="middle" font-family="Liberation Sans" font-size="16" font-weight="bold" fill="#0f172a">8</text>
  
