<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 300" width="100%" height="100%">
  <rect width="350" height="300" fill="#f8fafc" rx="8"/>
  <text x="175" y="26" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#0f172a">Le Cadran Circulaire : 12 Heures et 60 Minutes</text>
  
  <!-- Clock Face -->
  <circle cx="175" cy="155" r="110" fill="#ffffff" stroke="#1d4ed8" stroke-width="4"/>
  <circle cx="175" cy="155" r="4.5" fill="#0f172a"/>
  
  <!-- Hours Numbers -->
  <text x="175" y="70" text-anchor="middle" font-family="Liberation Sans" font-size="18" font-weight="bold" fill="#0f172a">12</text>
  <text x="225" y="85" text-anchor="middle" font-family="Liberation Sans" font-size="16" font-weight="bold" fill="#0f172a">1</text>
  <text x="255" y="120" text-anchor="middle" font-family="Liberation Sans" font-size="16" font-weight="bold" fill="#0f172a">2</text>
  <text x="265" y="161" text-anchor="middle" font-family="Liberation Sans" font-size="18" font-weight="bold" fill="#0f172a">3</text>
  <text x="255" y="202" text-anchor="middle" font-family="Liberation Sans" font-size="16" font-weight="bold" fill="#0f172a">4</text>
  <text x="225" y="235" text-anchor="middle" font-family="Liberation Sans" font-size="16" font-weight="bold" fill="#0f172a">5</text>
  <text x="175" y="250" text-anchor="middle" font-family="Liberation Sans" font-size="18" font-weight="bold" fill="#0f172a">6</text>
  <text x="125" y="235" text-anchor="middle" font-family="Liberation Sans" font-size="16" font-weight="bold" fill="#0f172a">7</text>
  <text x="95" y="202" text-anchor="middle" font-family="Liberation Sans" font-size="16" font-weight="bold" fill="#0f172a">8</text>
  <text x="85" y="161" text-anchor="middle" font-family="Liberation Sans" font-size="18" font-weight="bold" fill="#0f172a">9</text>
  <text x="95" y="120" text-anchor="middle" font-family="Liberation Sans" font-size="16" font-weight="bold" fill="#0f172a">10</text>
  <text x="125" y="85" text-anchor="middle" font-family="Liberation Sans" font-size="16" font-weight="bold" fill="#0f172a">11</text>
  
  <!-- Hour Hand pointing to 3 -->
  <line x1="175" y1="155" x2="230" y2="155" stroke="#b91c1c" stroke-width="5" stroke-linecap="round"/>
  <!-- Minute Hand pointing to 12 -->
  <line x1="175" y1="155" x2="175" y2="80" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  
  <text x="175" y="282" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#1d4ed8">Il est 3 heures pile (15h00)</text>
</svg>