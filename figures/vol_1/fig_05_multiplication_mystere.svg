<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="100%" height="180">
  <rect width="340" height="180" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="15" y="12" width="310" height="28" rx="4" fill="#eff6ff"/>
  <text x="170" y="31" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Opération mystère 2★ × 4 = 96</text>
  <g transform="translate(85, 48)" font-family="Liberation Mono, Courier, monospace" font-size="20" font-weight="bold" fill="#0f172a">
    <text x="40" y="25" font-size="13" fill="#b91c1c">(2)</text>
    <text x="30" y="43">2   ★</text>
    <text x="30" y="67">×       4</text>
    <line x1="0" y1="86" x2="160" y2="86" stroke="#0f172a" stroke-width="2"/>
    <text x="30" y="96">9   6</text>
  </g>
  <text x="170" y="165" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">★ × 4 se termine par 6 ⇒ ★ = 4, car 24 × 4 = 96</text>
</svg>