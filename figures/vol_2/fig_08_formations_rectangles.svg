<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <rect width="600" height="200" fill="#f8fafc" rx="8"/>
  <text x="300" y="28" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#0f172a">Organisation Rectangulaire des 12 Soldats : 2 × 6 et 3 × 4</text>
  
  <!-- 2 x 6 -->
  <rect x="40" y="45" width="240" height="135" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="160" y="70" text-anchor="middle" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#1d4ed8">Formation 2 × 6 = 12</text>
  <g transform="translate(65, 88)">
    <circle cx="0" cy="0" r="9" fill="#1d4ed8"/><circle cx="32" cy="0" r="9" fill="#1d4ed8"/><circle cx="64" cy="0" r="9" fill="#1d4ed8"/><circle cx="96" cy="0" r="9" fill="#1d4ed8"/><circle cx="128" cy="0" r="9" fill="#1d4ed8"/><circle cx="160" cy="0" r="9" fill="#1d4ed8"/>
    <circle cx="0" cy="28" r="9" fill="#1d4ed8"/><circle cx="32" cy="28" r="9" fill="#1d4ed8"/><circle cx="64" cy="28" r="9" fill="#1d4ed8"/><circle cx="96" cy="28" r="9" fill="#1d4ed8"/><circle cx="128" cy="28" r="9" fill="#1d4ed8"/><circle cx="160" cy="28" r="9" fill="#1d4ed8"/>
  </g>
  <text x="160" y="165" text-anchor="middle" font-family="Liberation Sans" font-size="11" fill="#475569">2 rangées de 6 soldats</text>
  
  <!-- 3 x 4 -->
  <rect x="320" y="45" width="240" height="135" fill="#ffffff" stroke="#15803d" stroke-width="1.5" rx="6"/>
  <text x="440" y="70" text-anchor="middle" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#15803d">Formation 3 × 4 = 12</text>
  <g transform="translate(370, 85)">
    <circle cx="0" cy="0" r="9" fill="#15803d"/><circle cx="32" cy="0" r="9" fill="#15803d"/><circle cx="64" cy="0" r="9" fill="#15803d"/><circle cx="96" cy="0" r="9" fill="#15803d"/>
    <circle cx="0" cy="24" r="9" fill="#15803d"/><circle cx="32" cy="24" r="9" fill="#15803d"/><circle cx="64" cy="24" r="9" fill="#15803d"/><circle cx="96" cy="24" r="9" fill="#15803d"/>
    <circle cx="0" cy="48" r="9" fill="#15803d"/><circle cx="32" cy="48" r="9" fill="#15803d"/><circle cx="64" cy="48" r="9" fill="#15803d"/><circle cx="96" cy="48" r="9" fill="#15803d"/>
  </g>
  <text x="440" y="168" text-anchor="middle" font-family="Liberation Sans" font-size="11" fill="#475569">3 rangées de 4 soldats</text>
</svg>