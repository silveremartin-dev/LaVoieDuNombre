<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 170" width="100%" height="100%">
  <rect width="500" height="170" fill="#f8fafc" rx="8"/>
  <text x="250" y="28" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#0f172a">Parité : Les Nombres Pairs s'associent par Paires, l'Impair Laisse un Solitaire</text>
  
  <g transform="translate(70, 50)">
    <!-- 5 pairs -->
    
      <rect x="0" y="10" width="28" height="58" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1" rx="4"/>
      <circle cx="14" cy="24" r="8" fill="#1d4ed8"/>
      <circle cx="14" cy="52" r="8" fill="#1d4ed8"/>
    
      <rect x="42" y="10" width="28" height="58" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1" rx="4"/>
      <circle cx="56" cy="24" r="8" fill="#1d4ed8"/>
      <circle cx="56" cy="52" r="8" fill="#1d4ed8"/>
    
      <rect x="84" y="10" width="28" height="58" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1" rx="4"/>
      <circle cx="98" cy="24" r="8" fill="#1d4ed8"/>
      <circle cx="98" cy="52" r="8" fill="#1d4ed8"/>
    
      <rect x="126" y="10" width="28" height="58" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1" rx="4"/>
      <circle cx="140" cy="24" r="8" fill="#1d4ed8"/>
      <circle cx="140" cy="52" r="8" fill="#1d4ed8"/>
    
      <rect x="168" y="10" width="28" height="58" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1" rx="4"/>
      <circle cx="182" cy="24" r="8" fill="#1d4ed8"/>
      <circle cx="182" cy="52" r="8" fill="#1d4ed8"/>
    
    
    <!-- 1 odd lonely soldier -->
    <rect x="220" y="10" width="36" height="58" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" rx="4"/>
    <circle cx="238" cy="24" r="8" fill="#b91c1c"/>
    <text x="238" y="55" text-anchor="middle" font-family="Liberation Sans" font-size="14" fill="#b91c1c">?</text>
    <text x="290" y="28" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#b91c1c">← Le soldat solitaire !</text>
    <text x="290" y="46" font-family="Liberation Sans" font-size="11" fill="#475569">11 est IMPAIR : 2 × 5 + 1</text>
  </g>
  <text x="250" y="150" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#0f172a">Un nombre pair se divise exactement par 2 ; un nombre impair a pour reste 1.</text>
</svg>