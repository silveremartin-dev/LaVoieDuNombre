  <text x="325" y="160" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#1d4ed8">Chaque saut ajoute 3 unités : 3, 6, 9, 12, 15, 18, 21 sont les multiples de 3.</text>
