<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="100%" height="100%">
  <rect width="650" height="200" fill="#f8fafc" rx="8"/>
  <text x="325" y="28" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#0f172a">Le Système Métrique Décimal Universel : Préfixes Multiples et Sous-Multiples</text>
  
  <!-- Left: Greek prefixes (multiples) -->
  <rect x="30" y="50" width="220" height="120" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="140" y="72" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#1d4ed8">PRÉFIXES GRECS (Multiples)</text>
  <text x="50" y="100" font-family="Liberation Sans" font-size="12" fill="#0f172a">• <tspan font-weight="bold">kilo-</tspan> (k) : × 1 000</text>
  <text x="50" y="125" font-family="Liberation Sans" font-size="12" fill="#0f172a">• <tspan font-weight="bold">hecto-</tspan> (h) : × 100</text>
  <text x="50" y="150" font-family="Liberation Sans" font-size="12" fill="#0f172a">• <tspan font-weight="bold">déca-</tspan> (da) : × 10</text>
  
  <!-- Center: Unit -->
  <rect x="270" y="70" width="110" height="80" fill="#d97706" rx="8"/>
  <text x="325" y="105" text-anchor="middle" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#ffffff">UNITÉ</text>
  <text x="325" y="125" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#ffffff">m, g, L</text>
  
  <!-- Right: Latin prefixes (submultiples) -->
  <rect x="400" y="50" width="220" height="120" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" rx="6"/>
  <text x="510" y="72" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#15803d">PRÉFIXES LATINS (Sous-multiples)</text>
  <text x="420" y="100" font-family="Liberation Sans" font-size="12" fill="#0f172a">• <tspan font-weight="bold">déci-</tspan> (d) : ÷ 10 (0,1)</text>
  <text x="420" y="125" font-family="Liberation Sans" font-size="12" fill="#0f172a">• <tspan font-weight="bold">centi-</tspan> (c) : ÷ 100 (0,01)</text>
  <text x="420" y="150" font-family="Liberation Sans" font-size="12" fill="#0f172a">• <tspan font-weight="bold">milli-</tspan> (m) : ÷ 1 000 (0,001)</text>
</svg>