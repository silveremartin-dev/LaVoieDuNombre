<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="250">
  <rect width="650" height="250" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Parité des fonctions mathématiques : Symétrie Axiale vs Symétrie Centrale</text>

  <!-- Left: Fonction Paire f(-x) = f(x) -->
  <g transform="translate(40, 45)">
    <rect width="250" height="155" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="125" y="22" font-family="Liberation Sans, sans-serif" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Fonction PAIRE : f(-x) = f(x)</text>
    <!-- Axes -->
    <line x1="20" y1="120" x2="230" y2="120" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="125" y1="140" x2="125" y2="35" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="135" y="45" font-family="Liberation Sans, sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8">Axe (Oy)</text>
    <!-- Symmetric parabola -->
    <path d="M 45 50 Q 125 130 205 50" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <!-- Points M and M' -->
    <circle cx="65" cy="70" r="4" fill="#b91c1c"/>
    <text x="50" y="65" font-family="Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">(-x, f(x))</text>
    <circle cx="185" cy="70" r="4" fill="#b91c1c"/>
    <text x="175" y="65" font-family="Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">(x, f(x))</text>
    <!-- Mirror dashed line -->
    <line x1="65" y1="70" x2="185" y2="70" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="125" y="145" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Symétrie axiale bilatérale</text>
  </g>

  <!-- Right: Fonction Impaire f(-x) = -f(x) -->
  <g transform="translate(360, 45)">
    <rect width="250" height="155" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="125" y="22" font-family="Liberation Sans, sans-serif" font-size="12.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">Fonction IMPAIRE : f(-x) = -f(x)</text>
    <!-- Axes -->
    <line x1="20" y1="85" x2="230" y2="85" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="125" y1="140" x2="125" y2="35" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="125" cy="85" r="4" fill="#d97706"/>
    <text x="132" y="98" font-family="Liberation Sans, sans-serif" font-size="10" font-weight="bold" fill="#d97706">O</text>
    <!-- Cubic curve -->
    <path d="M 45 130 C 95 110 110 95 125 85 C 140 75 155 60 205 40" fill="none" stroke="#b91c1c" stroke-width="3"/>
    <!-- Points M and M' -->
    <circle cx="65" cy="115" r="4" fill="#1d4ed8"/>
    <text x="45" y="110" font-family="Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#1d4ed8">(-x, -f(x))</text>
    <circle cx="185" cy="55" r="4" fill="#1d4ed8"/>
    <text x="175" y="50" font-family="Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#1d4ed8">(x, f(x))</text>
    <!-- Central line passing through O -->
    <line x1="65" y1="115" x2="185" y2="55" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="125" y="145" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Symétrie centrale par rapport à O</text>
  </g>

  <text x="325" y="235" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Exemples de référence : x² et cos(x) sont paires ; x³ et sin(x) sont impaires</text>
</svg>