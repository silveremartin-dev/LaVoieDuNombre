<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="250">
  <defs>
    <marker id="arr-blue4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-red4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="650" height="250" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Le produit scalaire : Travail d'une force W = F · AB = ||F|| × ||AB|| × cos(θ)</text>

  <!-- Left: Work of a pulling force on a sled -->
  <g transform="translate(40, 50)">
    <!-- Ground -->
    <line x1="20" y1="130" x2="260" y2="130" stroke="#64748b" stroke-width="2"/>
    <!-- Displacement AB -->
    <line x1="40" y1="130" x2="220" y2="130" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arr-blue4)"/>
    <text x="130" y="150" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Déplacement AB</text>
    <!-- Sled / point A -->
    <rect x="30" y="110" width="24" height="20" rx="3" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <text x="38" y="105" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">A</text>
    <!-- Force vector F -->
    <line x1="42" y1="120" x2="160" y2="50" stroke="#b91c1c" stroke-width="3.5" marker-end="url(#arr-red4)"/>
    <text x="170" y="55" font-family="Liberation Sans, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c">Force F</text>
    <!-- Angle theta -->
    <path d="M 80 130 A 40 40 0 0 0 74 102" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="90" y="118" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#d97706">θ</text>
    <!-- Projection H -->
    <line x1="160" y1="50" x2="160" y2="130" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="160" cy="130" r="3.5" fill="#0f172a"/>
    <text x="160" y="125" font-family="Liberation Sans, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">H</text>
    <text x="95" y="85" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#b91c1c">F·cos(θ) = AH</text>
  </g>

  <!-- Right: 3 Sign Cases -->
  <g transform="translate(340, 50)" font-family="Liberation Sans, sans-serif">
    <rect width="270" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="135" y="22" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Signe géométrique selon l'angle θ</text>
    <text x="15" y="55" font-size="11.5" fill="#15803d">• θ aigu (0° ≤ θ &lt; 90°) : u · v &gt; 0</text>
    <text x="25" y="72" font-size="10.5" fill="#64748b">Travail MOTEUR (la force favorise le mouvement)</text>
    <text x="15" y="95" font-size="11.5" fill="#1d4ed8">• θ droit (θ = 90°) : u · v = 0</text>
    <text x="25" y="112" font-size="10.5" fill="#64748b">Orthogonalité (aucun travail fourni)</text>
    <text x="15" y="135" font-size="11.5" fill="#b91c1c">• θ obtus (90° &lt; θ ≤ 180°) : u · v &lt; 0</text>
  </g>

  <text x="325" y="235" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Le produit scalaire mesure l'efficacité d'une direction par rapport à une autre : W = u · v = u_x v_x + u_y v_y</text>
</svg>