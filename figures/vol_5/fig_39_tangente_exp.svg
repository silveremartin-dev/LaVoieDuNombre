<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <rect width="500" height="280" fill="#f8fafc" rx="8"/>
  <text x="250" y="28" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#0f172a">L'Exponentielle et sa Tangente en 0 : e&#739; ≥ x + 1 (Inégalité de Convexité)</text>
  
  <g transform="translate(180, 200)">
    <!-- Axes -->
    <line x1="-140" y1="0" x2="260" y2="0" stroke="#0f172a" stroke-width="1.8"/>
    <polygon points="265,0 255,-4 255,4" fill="#0f172a"/>
    <text x="275" y="4" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#0f172a">x</text>
    
    <line x1="0" y1="40" x2="0" y2="-170" stroke="#0f172a" stroke-width="1.8"/>
    <polygon points="0,-175 -4,-165 4,-165" fill="#0f172a"/>
    <text x="-5" y="-182" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#0f172a">y</text>
    
    <!-- Tangent line y = x + 1 (in pixels: at x=0 y=-50, at x=-50 y=0, at x=100 y=-150) -->
    <line x1="-120" y1="70" x2="160" y2="-210" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="140" y="-180" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#b91c1c">y = x + 1 (tangente)</text>
    
    <!-- Curve y = e^x -->
    <path d="M -140,-3 Q -70,-8 0,-50 T 70,-136 T 100,-230" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <text x="65" y="-145" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#1d4ed8">y = e&#739;</text>
    
    <!-- Point (0, 1) -->
    <circle cx="0" cy="-50" r="5" fill="#d97706"/>
    <text x="-25" y="-50" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#0f172a">(0 ; 1)</text>
    <text x="-20" y="16" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#0f172a">0</text>
  </g>
  <text x="250" y="260" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#0f172a">Par convexité, la courbe de l'exponentielle est strictement au-dessus de toutes ses tangentes.</text>
</svg>