<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 240" width="100%" height="240">
  <rect width="650" height="240" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Anatomie d'une boîte à moustaches : Médiane, Quartiles et Écart interquartile</text>

  <g transform="translate(60, 45)">
    <!-- Graduated line (axe des valeurs) -->
    <line x1="30" y1="120" x2="500" y2="120" stroke="#0f172a" stroke-width="2"/>
    <!-- Ticks -->
    <line x1="50" y1="115" x2="50" y2="125" stroke="#0f172a" stroke-width="1.5"/>
    <text x="50" y="140" font-family="Liberation Sans, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">Min (Xmin)</text>
    <line x1="160" y1="115" x2="160" y2="125" stroke="#0f172a" stroke-width="1.5"/>
    <text x="160" y="140" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Q1 (25%)</text>
    <line x1="280" y1="115" x2="280" y2="125" stroke="#0f172a" stroke-width="1.5"/>
    <text x="280" y="140" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">Médiane Me (50%)</text>
    <line x1="380" y1="115" x2="380" y2="125" stroke="#0f172a" stroke-width="1.5"/>
    <text x="380" y="140" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Q3 (75%)</text>
    <line x1="480" y1="115" x2="480" y2="125" stroke="#0f172a" stroke-width="1.5"/>
    <text x="480" y="140" font-family="Liberation Sans, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">Max (Xmax)</text>

    <!-- Whiskers (moustaches) -->
    <line x1="50" y1="65" x2="160" y2="65" stroke="#0f172a" stroke-width="2"/>
    <line x1="50" y1="45" x2="50" y2="85" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="380" y1="65" x2="480" y2="65" stroke="#0f172a" stroke-width="2"/>
    <line x1="480" y1="45" x2="480" y2="85" stroke="#0f172a" stroke-width="2.5"/>

    <!-- The Box (Q1 to Q3) -->
    <rect x="160" y="35" width="220" height="60" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <!-- Median line inside box -->
    <line x1="280" y1="35" x2="280" y2="95" stroke="#b91c1c" stroke-width="3.5"/>

    <!-- Interquartile Range label above box -->
    <path d="M 160 25 L 380 25" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="270" y="18" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Écart interquartile IQR = Q3 - Q1 (50% central des données)</text>
  </g>

  <text x="325" y="222" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">La boîte à moustaches résume en un coup d'œil la position centrale et la dispersion d'une série statistique</text>
</svg>