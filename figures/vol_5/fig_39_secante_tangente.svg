<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="250">
  <defs>
    <marker id="arr-dark8" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="650" height="250" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">La dérivée comme limite des sécantes : f'(a) = lim [f(a+h) - f(a)] / h</text>

  <g transform="translate(100, 45)">
    <!-- Axes -->
    <line x1="20" y1="140" x2="440" y2="140" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr-dark8)"/>
    <text x="435" y="155" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">x</text>
    <line x1="50" y1="160" x2="50" y2="20" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr-dark8)"/>
    <text x="38" y="20" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">y</text>

    <!-- Parabolic Curve -->
    <path d="M 60 135 Q 200 130 380 30" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <text x="385" y="30" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">y = f(x)</text>

    <!-- Point A(a, f(a)) at x = 160, y = 110 -->
    <circle cx="160" cy="110" r="5" fill="#b91c1c"/>
    <text x="140" y="105" font-family="Liberation Sans, sans-serif" font-size="11.5" font-weight="bold" fill="#b91c1c">A(a, f(a))</text>
    <line x1="160" y1="110" x2="160" y2="140" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="160" y="155" font-family="Liberation Sans, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">a</text>

    <!-- Point M(a+h, f(a+h)) at x = 280, y = 60 -->
    <circle cx="280" cy="60" r="4.5" fill="#1d4ed8"/>
    <text x="285" y="58" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">M(a+h, f(a+h))</text>
    <line x1="280" y1="60" x2="280" y2="140" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="280" y="155" font-family="Liberation Sans, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">a + h</text>

    <!-- Sécante AM (blue dashed) -->
    <line x1="100" y1="135" x2="340" y2="35" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="345" y="45" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#1d4ed8">Sécante (AM)</text>

    <!-- Tangente en A (red solid) -->
    <line x1="90" y1="140" x2="280" y2="58" stroke="#b91c1c" stroke-width="3"/>
    <text x="235" y="70" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">Tangente en A (pente f'(a))</text>

    <!-- Little arrow showing h -> 0 -->
    <path d="M 270 148 L 180 148" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-dark8)"/>
    <text x="225" y="165" font-family="Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#d97706" text-anchor="middle">h → 0</text>
  </g>

  <text x="325" y="235" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Lorsque h se rapproche de zéro, la corde sécante pivote et s'immobilise dans la position limite de la droite tangente</text>
</svg>