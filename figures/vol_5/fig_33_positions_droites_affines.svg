<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 240" width="100%" height="240">
  <rect width="650" height="240" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Positions relatives de deux droites affines d et d' dans le plan</text>

  <!-- Case 1: Sécantes (m != m') -->
  <g transform="translate(30, 45)">
    <rect width="170" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="85" y="24" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">Droites sécantes</text>
    <line x1="20" y1="120" x2="150" y2="40" stroke="#1d4ed8" stroke-width="2.5"/>
    <line x1="20" y1="40" x2="150" y2="120" stroke="#b91c1c" stroke-width="2.5"/>
    <circle cx="85" cy="80" r="4.5" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <text x="92" y="75" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">I(x, y)</text>
    <text x="85" y="135" font-family="Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Pentes différentes : m ≠ m'</text>
  </g>

  <!-- Case 2: Strictement parallèles (m = m', p != p') -->
  <g transform="translate(240, 45)">
    <rect width="170" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="85" y="24" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Strictement parallèles</text>
    <line x1="20" y1="90" x2="150" y2="40" stroke="#1d4ed8" stroke-width="2.5"/>
    <line x1="20" y1="130" x2="150" y2="80" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="85" y="125" font-family="Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Même pente : m = m'</text>
    <text x="85" y="140" font-family="Liberation Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Ordonnées : p ≠ p' (0 pt commun)</text>
  </g>

  <!-- Case 3: Confondues (m = m', p = p') -->
  <g transform="translate(450, 45)">
    <rect width="170" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="85" y="24" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Droites confondues</text>
    <line x1="20" y1="110" x2="150" y2="50" stroke="#15803d" stroke-width="4"/>
    <text x="85" y="125" font-family="Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">m = m' et p = p'</text>
    <text x="85" y="140" font-family="Liberation Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Une infinité de points communs</text>
  </g>

  <text x="325" y="222" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">La condition d'intersection se traduit algébriquement par le déterminant non nul : ab' - a'b ≠ 0</text>
</svg>