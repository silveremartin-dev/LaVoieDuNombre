<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect width="600" height="240" fill="#f8fafc" rx="8"/>
  <text x="300" y="28" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#0f172a">L'Arbre Pondéré du Dépistage Médical et la Formule de Bayes</text>
  
  <g transform="translate(60, 50)">
    <!-- Root -->
    <circle cx="20" cy="70" r="6" fill="#0f172a"/>
    <text x="10" y="95" text-anchor="middle" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#0f172a">Population</text>
    
    <!-- Branch M (Malade) -->
    <line x1="26" y1="67" x2="160" y2="30" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="80" y="42" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#b91c1c">P(M) = 0,01</text>
    <rect x="160" y="15" width="80" height="30" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" rx="4"/>
    <text x="200" y="35" text-anchor="middle" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#b91c1c">Malade (M)</text>
    
    <!-- Sub-branches from M -->
    <line x1="240" y1="25" x2="360" y2="10" stroke="#b91c1c" stroke-width="2"/>
    <text x="290" y="14" font-family="Liberation Sans" font-size="11" fill="#0f172a">T+ : 0,99</text>
    <text x="370" y="14" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#b91c1c">Vrai Positif (0,0099)</text>
    
    <line x1="240" y1="35" x2="360" y2="50" stroke="#475569" stroke-width="1.5"/>
    <text x="290" y="48" font-family="Liberation Sans" font-size="11" fill="#475569">T- : 0,01</text>
    <text x="370" y="54" font-family="Liberation Sans" font-size="12" fill="#475569">Faux Négatif (0,0001)</text>
    
    <!-- Branch Non-M (Sain) -->
    <line x1="26" y1="73" x2="160" y2="115" stroke="#15803d" stroke-width="2.5"/>
    <text x="80" y="105" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#15803d">P(M&#773;) = 0,99</text>
    <rect x="160" y="100" width="80" height="30" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" rx="4"/>
    <text x="200" y="120" text-anchor="middle" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#15803d">Sain (M&#773;)</text>
    
    <!-- Sub-branches from Non-M -->
    <line x1="240" y1="110" x2="360" y2="95" stroke="#d97706" stroke-width="1.5"/>
    <text x="290" y="100" font-family="Liberation Sans" font-size="11" fill="#0f172a">T+ : 0,02</text>
    <text x="370" y="100" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#d97706">Faux Positif (0,0198)</text>
    
    <line x1="240" y1="120" x2="360" y2="135" stroke="#15803d" stroke-width="2"/>
    <text x="290" y="134" font-family="Liberation Sans" font-size="11" fill="#0f172a">T- : 0,98</text>
    <text x="370" y="140" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#15803d">Vrai Négatif (0,9702)</text>
  </g>
  <text x="300" y="222" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#1d4ed8">Formule de Bayes : P(M | T+) = 0,0099 / (0,0099 + 0,0198) ≈ 33,3 % seulement !</text>
</svg>