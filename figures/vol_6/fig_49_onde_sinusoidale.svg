<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="250">
  <defs>
    <marker id="arr-dark4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="650" height="250" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="24" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Génération de l'onde sinusoïdale par déroulement temporel du cercle en rotation</text>

  <!-- Circle (left) -->
  <g transform="translate(110, 130)">
    <line x1="-70" y1="0" x2="80" y2="0" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="0" y1="70" x2="0" y2="-70" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Rotating point M at 45 deg -->
    <line x1="0" y1="0" x2="38.9" y2="-38.9" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="38.9" cy="-38.9" r="4.5" fill="#b91c1c"/>
    <text x="45" y="-45" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">M(t)</text>
    <!-- Projection line connecting circle to wave -->
    <line x1="38.9" y1="-38.9" x2="160" y2="-38.9" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Wave (right) -->
  <g transform="translate(260, 130)">
    <line x1="0" y1="0" x2="350" y2="0" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr-dark4)"/>
    <text x="340" y="-8" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">t (temps)</text>
    <line x1="0" y1="70" x2="0" y2="-70" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr-dark4)"/>
    <text x="8" y="-60" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">y = sin(t)</text>

    <!-- Sine Wave path -->
    <!-- 2 full periods: period = 140px -->
    <!-- M 0,0 Q 35,-55 70,0 T 140,0 Q 175,-55 210,0 T 280,0 -->
    <path d="M 0 0 C 25 -73, 45 -73, 70 0 C 95 73, 115 73, 140 0 C 165 -73, 185 -73, 210 0 C 235 73, 255 73, 280 0" fill="none" stroke="#1d4ed8" stroke-width="3"/>

    <!-- Point corresponding to M -->
    <circle cx="17.5" cy="-38.9" r="4.5" fill="#b91c1c"/>
    <!-- Connecting line from circle point -->
    <line x1="-90" y1="-38.9" x2="17.5" y2="-38.9" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Marks: π, 2π -->
    <text x="70" y="16" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">π</text>
    <text x="140" y="16" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">2π</text>
    <text x="210" y="16" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">3π</text>
    <text x="280" y="16" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">4π</text>
  </g>

  <text x="325" y="235" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">La rotation circulaire uniforme projette une onde harmonique pure à travers le temps</text>
</svg>