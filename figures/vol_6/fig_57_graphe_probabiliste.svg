<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 260" width="100%" height="260">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="650" height="260" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="32" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Graphe probabiliste à 2 états et matrice de transition associée</text>

  <!-- Node A -->
  <circle cx="180" cy="140" r="42" fill="#ffffff" stroke="#1d4ed8" stroke-width="3.5"/>
  <text x="180" y="147" font-family="Liberation Sans, sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A</text>

  <!-- Node B -->
  <circle cx="470" cy="140" r="42" fill="#ffffff" stroke="#b91c1c" stroke-width="3.5"/>
  <text x="470" y="147" font-family="Liberation Sans, sans-serif" font-size="20" font-weight="bold" fill="#b91c1c" text-anchor="middle">B</text>

  <!-- Loop on A (weight 0.8) -->
  <path d="M 155 105 C 120 40, 70 120, 145 155" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <rect x="75" y="70" width="38" height="22" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="94" y="86" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">0.8</text>

  <!-- Loop on B (weight 0.6) -->
  <path d="M 495 105 C 530 40, 580 120, 505 155" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <rect x="535" y="70" width="38" height="22" rx="4" fill="#ffffff" stroke="#b91c1c" stroke-width="1"/>
  <text x="554" y="86" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">0.6</text>

  <!-- Transition A -> B (weight 0.2) -->
  <path d="M 222 125 C 300 95, 350 95, 428 125" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <rect x="306" y="88" width="38" height="22" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="325" y="104" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">0.2</text>

  <!-- Transition B -> A (weight 0.4) -->
  <path d="M 428 155 C 350 185, 300 185, 222 155" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <rect x="306" y="170" width="38" height="22" rx="4" fill="#ffffff" stroke="#b91c1c" stroke-width="1"/>
  <text x="325" y="186" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">0.4</text>

  <!-- Formula note -->
  <text x="325" y="235" font-family="Liberation Sans, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Matrice de transition : M = ((0.8, 0.2), (0.4, 0.6)) — Somme de chaque ligne = 1</text>
</svg>