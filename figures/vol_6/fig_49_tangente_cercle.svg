<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" width="100%" height="300">
  <defs>
    <marker id="arr-dark3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="650" height="300" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">La ligne trigonométrique de la tangente : tan(x) = sin(x) / cos(x)</text>

  <g transform="translate(260, 160)">
    <!-- Axes -->
    <line x1="-130" y1="0" x2="180" y2="0" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr-dark3)"/>
    <text x="175" y="-8" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">x</text>
    <line x1="0" y1="120" x2="0" y2="-130" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr-dark3)"/>
    <text x="8" y="-120" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">y</text>

    <!-- Circle (r = 90) -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Tangent line at x = 1 (X = 90) -->
    <line x1="90" y1="120" x2="90" y2="-120" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="95" y="-115" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">Droite x = 1</text>

    <!-- Ray at angle 40 deg -->
    <!-- cos 40 = 0.766, sin 40 = 0.643; tan 40 = 0.839 -->
    <!-- 90 * tan 40 = 75.5 -->
    <line x1="0" y1="0" x2="90" y2="-75.5" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="90" y1="-75.5" x2="135" y2="-113.25" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Point M on circle -->
    <circle cx="68.9" cy="-57.8" r="4" fill="#1d4ed8"/>
    <text x="50" y="-62" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">M</text>

    <!-- Point T on tangent line -->
    <circle cx="90" cy="-75.5" r="5" fill="#b91c1c"/>
    <text x="98" y="-72" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">T(1, tan x)</text>

    <!-- Angle arc -->
    <path d="M 30 0 A 30 30 0 0 0 23 -19" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="36" y="-8" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#d97706">x</text>

    <!-- Projections -->
    <line x1="68.9" y1="0" x2="68.9" y2="-57.8" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="60" y="15" font-family="Liberation Sans, sans-serif" font-size="10" fill="#64748b">cos x</text>
    <text x="75" y="-30" font-family="Liberation Sans, sans-serif" font-size="10" fill="#64748b">sin x</text>

    <!-- Tangent segment highlighted in red -->
    <line x1="90" y1="0" x2="90" y2="-75.5" stroke="#b91c1c" stroke-width="4"/>
  </g>

  <!-- Explanation card -->
  <g transform="translate(450, 70)" font-family="Liberation Sans, sans-serif">
    <rect width="170" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="85" y="24" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Propriétés clés</text>
    <text x="15" y="55" font-size="11.5" fill="#b91c1c">• tan(x) = AT</text>
    <text x="15" y="80" font-size="11.5" fill="#0f172a">• tan(0) = 0</text>
    <text x="15" y="105" font-size="11.5" fill="#0f172a">• tan(π/4) = 1</text>
    <text x="15" y="130" font-size="11.5" fill="#b91c1c">• Asymptote en π/2</text>
  </g>
  <text x="325" y="285" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">La tangente géométrique est la longueur interceptée sur la droite x = 1 par le prolongement du rayon OM</text>
</svg>