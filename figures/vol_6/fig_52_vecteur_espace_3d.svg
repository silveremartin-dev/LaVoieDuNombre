<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280" width="100%" height="280">
  <defs>
    <marker id="arr-blue3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="650" height="280" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Coordonnées et norme d'un vecteur dans l'espace à 3 dimensions</text>

  <g transform="translate(200, 150)">
    <!-- 3D Axes -->
    <line x1="0" y1="0" x2="220" y2="0" stroke="#0f172a" stroke-width="1.5"/>
    <text x="215" y="-8" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">y</text>
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#0f172a" stroke-width="1.5"/>
    <text x="8" y="-115" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">z</text>
    <line x1="0" y1="0" x2="-90" y2="90" stroke="#0f172a" stroke-width="1.5"/>
    <text x="-95" y="105" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">x</text>

    <!-- Parallelepiped box projection for Vector AB -->
    <!-- Point A(2, 2, 1) and Point B(6, 7, 5) -->
    <!-- Point A -->
    <circle cx="40" cy="-20" r="4.5" fill="#b91c1c"/>
    <text x="25" y="-22" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">A(xA, yA, zA)</text>
    <!-- Point B -->
    <circle cx="160" cy="-90" r="4.5" fill="#b91c1c"/>
    <text x="168" y="-92" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">B(xB, yB, zB)</text>

    <!-- Vector AB -->
    <line x1="40" y1="-20" x2="155" y2="-87" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arr-blue3)"/>

    <!-- Projection box dashed lines -->
    <line x1="40" y1="-20" x2="160" y2="-20" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="100" y="-8" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#1d4ed8">Δy = yB - yA</text>
    <line x1="160" y1="-20" x2="160" y2="-90" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="165" y="-55" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#b91c1c">Δz = zB - zA</text>
  </g>

  <!-- Formula Card -->
  <rect x="420" y="70" width="200" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="520" y="95" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Formules fondamentales</text>
  <text x="435" y="125" font-family="Liberation Sans, sans-serif" font-size="11.5" fill="#1d4ed8">u = AB (xB-xA ; yB-yA ; zB-zA)</text>
  <text x="435" y="155" font-family="Liberation Sans, sans-serif" font-size="11.5" fill="#0f172a">||AB|| = √(Δx² + Δy² + Δz²)</text>
  <text x="325" y="260" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Le théorème de Pythagore se généralise naturellement en dimension 3 par addition du terme vertical Δz²</text>
</svg>