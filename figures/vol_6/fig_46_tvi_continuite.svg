<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="250">
  <defs>
    <marker id="arr-dark10" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="650" height="250" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Le Théorème des Valeurs Intermédiaires (TVI) : f continue sur [a, b]</text>

  <g transform="translate(110, 45)">
    <!-- Axes -->
    <line x1="20" y1="140" x2="430" y2="140" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr-dark10)"/>
    <text x="425" y="155" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">x</text>
    <line x1="50" y1="160" x2="50" y2="20" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr-dark10)"/>
    <text x="38" y="20" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">y</text>

    <!-- Point a and f(a) -->
    <line x1="90" y1="140" x2="90" y2="120" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="50" y1="120" x2="90" y2="120" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="90" cy="120" r="4.5" fill="#1d4ed8"/>
    <text x="90" y="155" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">a</text>
    <text x="25" y="125" font-family="Liberation Sans, sans-serif" font-size="11" fill="#1d4ed8">f(a)</text>

    <!-- Point b and f(b) -->
    <line x1="360" y1="140" x2="360" y2="40" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="50" y1="40" x2="360" y2="40" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="360" cy="40" r="4.5" fill="#1d4ed8"/>
    <text x="360" y="155" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">b</text>
    <text x="25" y="45" font-family="Liberation Sans, sans-serif" font-size="11" fill="#1d4ed8">f(b)</text>

    <!-- Continuous curve from A to B -->
    <path d="M 90 120 C 150 140, 180 30, 240 70 C 280 100, 310 30, 360 40" fill="none" stroke="#1d4ed8" stroke-width="3"/>

    <!-- Intermediate value k line -->
    <line x1="40" y1="80" x2="390" y2="80" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="32" y="84" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">k</text>

    <!-- Intersections c1, c2, c3 -->
    <circle cx="170" cy="80" r="4.5" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="170" y1="80" x2="170" y2="140" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="170" y="155" font-family="Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">c1</text>

    <circle cx="230" cy="80" r="4.5" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="230" y1="80" x2="230" y2="140" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="230" y="155" font-family="Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">c2</text>

    <circle cx="335" cy="80" r="4.5" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="335" y1="80" x2="335" y2="140" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="335" y="155" font-family="Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">c3</text>
  </g>

  <text x="325" y="235" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Puisque le tracé ne comporte aucune déchirure, la droite horizontale y = k est obligatoirement traversée au moins une fois</text>
</svg>