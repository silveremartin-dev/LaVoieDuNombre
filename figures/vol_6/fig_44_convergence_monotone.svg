<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%">
  <rect width="540" height="260" fill="#f8fafc" rx="8"/>
  <text x="270" y="28" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#0f172a">Théorème de Convergence Monotone : Toute Suite Croissante et Majorée Converge</text>
  
  <g transform="translate(60, 200)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="420" y2="0" stroke="#0f172a" stroke-width="1.8"/>
    <polygon points="425,0 415,-4 415,4" fill="#0f172a"/>
    <text x="435" y="4" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#0f172a">n</text>
    
    <line x1="0" y1="10" x2="0" y2="-150" stroke="#0f172a" stroke-width="1.8"/>
    <polygon points="0,-155 -4,-145 4,-145" fill="#0f172a"/>
    <text x="-5" y="-160" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#0f172a">u_n</text>
    
    <!-- Majorant M ceiling line -->
    <line x1="0" y1="-135" x2="410" y2="-135" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="415" y="-132" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#b91c1c">Plafond Majorant M</text>
    
    <!-- Limit L asymptote line -->
    <line x1="0" y1="-110" x2="410" y2="-110" stroke="#1d4ed8" stroke-width="2"/>
    <text x="415" y="-107" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#1d4ed8">Limite L = sup(u_n)</text>
    
    <!-- Points of increasing sequence u_n -->
    
      <circle cx="15" cy="-51.5" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1"/>
      <text x="15" y="15" text-anchor="middle" font-family="Liberation Sans" font-size="10" fill="#475569">0</text>
    
      <circle cx="53" cy="-71.975" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1"/>
      <text x="53" y="15" text-anchor="middle" font-family="Liberation Sans" font-size="10" fill="#475569">1</text>
    
      <circle cx="91" cy="-85.28375" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1"/>
      <text x="91" y="15" text-anchor="middle" font-family="Liberation Sans" font-size="10" fill="#475569">2</text>
    
      <circle cx="129" cy="-93.93443749999999" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1"/>
      <text x="129" y="15" text-anchor="middle" font-family="Liberation Sans" font-size="10" fill="#475569">3</text>
    
      <circle cx="167" cy="-99.557384375" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1"/>
      <text x="167" y="15" text-anchor="middle" font-family="Liberation Sans" font-size="10" fill="#475569">4</text>
    
      <circle cx="205" cy="-103.21229984375" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1"/>
      <text x="205" y="15" text-anchor="middle" font-family="Liberation Sans" font-size="10" fill="#475569">5</text>
    
      <circle cx="243" cy="-105.5879948984375" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1"/>
      <text x="243" y="15" text-anchor="middle" font-family="Liberation Sans" font-size="10" fill="#475569">6</text>
    
      <circle cx="281" cy="-107.13219668398438" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1"/>
      <text x="281" y="15" text-anchor="middle" font-family="Liberation Sans" font-size="10" fill="#475569">7</text>
    
      <circle cx="319" cy="-108.13592784458984" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1"/>
      <text x="319" y="15" text-anchor="middle" font-family="Liberation Sans" font-size="10" fill="#475569">8</text>
    
      <circle cx="357" cy="-108.7883530989834" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1"/>
      <text x="357" y="15" text-anchor="middle" font-family="Liberation Sans" font-size="10" fill="#475569">9</text>
    
  </g>
  <text x="270" y="245" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#0f172a">Les termes progressent toujours vers le haut sans jamais dépasser le plafond : convergence forcée.</text>
</svg>