<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="250">
  <rect width="650" height="250" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Le pendule simple : Modélisation d'un mouvement périodique θ''(t) + ω₀²·sin(θ) = 0</text>

  <g transform="translate(325, 45)">
    <!-- Ceiling support -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#0f172a" stroke-width="3"/>
    <line x1="-70" y1="0" x2="-60" y2="-10" stroke="#64748b" stroke-width="1.5"/>
    <line x1="-40" y1="0" x2="-30" y2="-10" stroke="#64748b" stroke-width="1.5"/>
    <line x1="-10" y1="0" x2="0" y2="-10" stroke="#64748b" stroke-width="1.5"/>
    <line x1="20" y1="0" x2="30" y2="-10" stroke="#64748b" stroke-width="1.5"/>
    <line x1="50" y1="0" x2="60" y2="-10" stroke="#64748b" stroke-width="1.5"/>

    <!-- Pivot point O -->
    <circle cx="0" cy="0" r="5" fill="#0f172a"/>
    <text x="12" y="-4" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">O</text>

    <!-- Vertical reference (dashed) -->
    <line x1="0" y1="0" x2="0" y2="150" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Pendulum string at angle theta = 30 deg, L = 140 -->
    <!-- x = 140*sin(30) = 70, y = 140*cos(30) = 121.2 -->
    <line x1="0" y1="0" x2="70" y2="121.2" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="45" y="60" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">Longueur L</text>

    <!-- Angle arc theta -->
    <path d="M 0 50 A 50 50 0 0 1 25 43.3" fill="none" stroke="#d97706" stroke-width="2"/>
    <text x="15" y="68" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#d97706">θ(t)</text>

    <!-- Bob (mass m) -->
    <circle cx="70" cy="121.2" r="14" fill="#b91c1c" stroke="#0f172a" stroke-width="2"/>
    <text x="70" y="125.5" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">m</text>

    <!-- Velocity vector v (tangent to circle arc) -->
    <line x1="70" y1="121.2" x2="105" y2="101" stroke="#15803d" stroke-width="2.5"/>
    <text x="110" y="98" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#15803d">v</text>

    <!-- Trajectory arc -->
    <path d="M -70 121.2 Q 0 145 70 121.2" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Side info card -->
  <g transform="translate(60, 70)" font-family="Liberation Sans, sans-serif">
    <rect width="160" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="80" y="22" font-size="11.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Petites oscillations</text>
    <text x="15" y="48" font-size="11" fill="#1d4ed8">• sin(θ) ≈ θ</text>
    <text x="15" y="70" font-size="11" fill="#b91c1c">• Période T₀ = 2π√(L/g)</text>
  </g>

  <text x="325" y="235" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">La période des petites oscillations ne dépend ni de la masse suspendue, ni de l'amplitude initiale (isochronisme)</text>
</svg>