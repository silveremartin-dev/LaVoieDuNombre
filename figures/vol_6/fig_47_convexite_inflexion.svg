<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="250">
  <rect width="650" height="250" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Convexité, Concavité et Point d'Inflexion : Position des Cordes et des Tangentes</text>

  <!-- Left: Convexe -->
  <g transform="translate(40, 45)">
    <rect width="255" height="155" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="127" y="22" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">CONVEXE : f''(x) ≥ 0</text>
    <!-- Axes -->
    <line x1="20" y1="130" x2="235" y2="130" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="30" y1="140" x2="30" y2="35" stroke="#0f172a" stroke-width="1.2"/>
    <!-- Curve f convex (cup shape) -->
    <path d="M 40 60 Q 120 135 220 50" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <!-- Chord (segment) AB strictly above curve -->
    <line x1="55" y1="80" x2="200" y2="60" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4,3"/>
    <circle cx="55" cy="80" r="4" fill="#b91c1c"/>
    <text x="45" y="75" font-family="Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">A</text>
    <circle cx="200" cy="60" r="4" fill="#b91c1c"/>
    <text x="208" y="60" font-family="Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#b91c1c">B</text>
    <!-- Tangent line strictly below curve -->
    <line x1="60" y1="125" x2="180" y2="125" stroke="#15803d" stroke-width="2"/>
    <text x="127" y="145" font-family="Liberation Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">La courbe est AU-DESSUS de ses tangentes</text>
  </g>

  <!-- Right: Concave & Inflexion -->
  <g transform="translate(355, 45)">
    <rect width="255" height="155" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="127" y="22" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">POINT D'INFLEXION : f''(x) = 0</text>
    <!-- Axes -->
    <line x1="20" y1="130" x2="235" y2="130" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="30" y1="140" x2="30" y2="35" stroke="#0f172a" stroke-width="1.2"/>
    <!-- S-curve passing through inflection -->
    <path d="M 40 120 C 100 115 110 80 135 75 C 160 70 170 35 225 35" fill="none" stroke="#0f172a" stroke-width="3"/>
    <!-- Inflection point I -->
    <circle cx="135" cy="75" r="5" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <text x="145" y="70" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Inflexion I</text>
    <!-- Tangent crossing the curve at I -->
    <line x1="75" y1="105" x2="195" y2="45" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="127" y="145" font-family="Liberation Sans, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">La tangente TRAVERSE la courbe en I</text>
  </g>

  <text x="325" y="235" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">La dérivée seconde f''(x) mesure l'accélération de la pente : positive pour un creux (convexe), négative pour une bosse (concave)</text>
</svg>