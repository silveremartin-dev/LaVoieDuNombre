<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 260" width="100%" height="260">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="650" height="260" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="30" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Graphe orienté à 3 sommets et sa matrice d'adjacence</text>

  <!-- Graph side (left) -->
  <g transform="translate(40, 20)">
    <!-- Nodes -->
    <!-- Sommet 1 (top) -->
    <circle cx="120" cy="60" r="24" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="120" y="67" font-family="Liberation Sans, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1</text>
    <!-- Sommet 2 (bottom left) -->
    <circle cx="50" cy="170" r="24" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
    <text x="50" y="177" font-family="Liberation Sans, sans-serif" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">2</text>
    <!-- Sommet 3 (bottom right) -->
    <circle cx="190" cy="170" r="24" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
    <text x="190" y="177" font-family="Liberation Sans, sans-serif" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">3</text>

    <!-- Directed edges -->
    <!-- 1 -> 2 -->
    <path d="M 103 77 L 67 150" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arr-dark)"/>
    <!-- 2 -> 3 -->
    <path d="M 75 170 L 164 170" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arr-dark)"/>
    <!-- 3 -> 1 -->
    <path d="M 173 150 L 137 77" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arr-dark)"/>
    <!-- Loop on 1 -->
    <path d="M 105 40 C 90 5, 150 5, 135 40" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arr-dark)"/>
  </g>

  <!-- Matrix side (right) -->
  <g transform="translate(360, 50)" font-family="Liberation Sans, sans-serif">
    <text x="110" y="20" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Matrice d'adjacence M</text>
    <!-- Column headers -->
    <text x="70" y="50" font-size="12" font-weight="bold" fill="#1d4ed8">v1</text>
    <text x="110" y="50" font-size="12" font-weight="bold" fill="#b91c1c">v2</text>
    <text x="150" y="50" font-size="12" font-weight="bold" fill="#15803d">v3</text>
    
    <!-- Row headers & values -->
    <text x="35" y="80" font-size="12" font-weight="bold" fill="#1d4ed8">v1</text>
    <text x="35" y="115" font-size="12" font-weight="bold" fill="#b91c1c">v2</text>
    <text x="35" y="150" font-size="12" font-weight="bold" fill="#15803d">v3</text>

    <!-- Matrix brackets -->
    <path d="M 55 60 L 50 60 L 50 165 L 55 165" fill="none" stroke="#0f172a" stroke-width="2"/>
    <path d="M 165 60 L 170 60 L 170 165 L 165 165" fill="none" stroke="#0f172a" stroke-width="2"/>

    <!-- Values -->
    <text x="70" y="80" font-size="14" fill="#0f172a">1</text>
    <text x="110" y="80" font-size="14" fill="#0f172a">1</text>
    <text x="150" y="80" font-size="14" fill="#0f172a">0</text>

    <text x="70" y="115" font-size="14" fill="#0f172a">0</text>
    <text x="110" y="115" font-size="14" fill="#0f172a">0</text>
    <text x="150" y="115" font-size="14" fill="#0f172a">1</text>

    <text x="70" y="150" font-size="14" fill="#0f172a">1</text>
    <text x="110" y="150" font-size="14" fill="#0f172a">0</text>
    <text x="150" y="150" font-size="14" fill="#0f172a">0</text>
  </g>
</svg>