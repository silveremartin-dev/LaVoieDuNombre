<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%">
  <rect width="540" height="260" fill="#f8fafc" rx="8"/>
  <text x="270" y="28" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#0f172a">Chemins sur un Quadrillage de A(0 ; 0) à B(5 ; 3) : Formule Binomiale (8 parmi 3) = 56</text>
  
  <g transform="translate(140, 60)">
    <!-- Grid 5x3 -->
    
      <line x1="0" y1="0" x2="0" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
    
      <line x1="50" y1="0" x2="50" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
    
      <line x1="100" y1="0" x2="100" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
    
      <line x1="150" y1="0" x2="150" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
    
      <line x1="200" y1="0" x2="200" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
    
      <line x1="250" y1="0" x2="250" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
    
    
      <line x1="0" y1="0" x2="250" y2="0" stroke="#cbd5e1" stroke-width="1.5"/>
    
      <line x1="0" y1="50" x2="250" y2="50" stroke="#cbd5e1" stroke-width="1.5"/>
    
      <line x1="0" y1="100" x2="250" y2="100" stroke="#cbd5e1" stroke-width="1.5"/>
    
      <line x1="0" y1="150" x2="250" y2="150" stroke="#cbd5e1" stroke-width="1.5"/>
    
    
    <!-- One example path in Byrne Red: Right, Right, Up, Right, Up, Right, Right, Up -->
    <polyline points="0,150 50,150 100,150 100,100 150,100 150,50 200,50 250,50 250,0" fill="none" stroke="#b91c1c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Start Point A(0,0) -->
    <circle cx="0" cy="150" r="6" fill="#1d4ed8"/>
    <text x="-15" y="170" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#1d4ed8">A(0 ; 0)</text>
    
    <!-- End Point B(5,3) -->
    <circle cx="250" cy="0" r="6" fill="#15803d"/>
    <text x="275" y="-5" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#15803d">B(5 ; 3)</text>
  </g>
  <text x="270" y="240" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#0f172a">Tout chemin comprend exactement 5 pas vers la Droite et 3 pas vers le Haut : binom(8, 3) = 56 chemins.</text>
</svg>