<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 240" width="100%" height="240">
  <rect width="650" height="240" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Positions relatives de deux droites dans l'espace à 3 dimensions</text>

  <!-- Case 1: Parallèles (coplanaires) -->
  <g transform="translate(30, 45)">
    <rect width="170" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="85" y="24" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Parallèles</text>
    <line x1="25" y1="60" x2="145" y2="40" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="148" y="44" font-family="Liberation Sans, sans-serif" font-size="10" fill="#1d4ed8">d1</text>
    <line x1="25" y1="110" x2="145" y2="90" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="148" y="94" font-family="Liberation Sans, sans-serif" font-size="10" fill="#1d4ed8">d2</text>
    <text x="85" y="135" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Vecteurs colinéaires</text>
  </g>

  <!-- Case 2: Sécantes (coplanaires) -->
  <g transform="translate(240, 45)">
    <rect width="170" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="85" y="24" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">Sécantes</text>
    <line x1="25" y1="120" x2="145" y2="40" stroke="#b91c1c" stroke-width="2.5"/>
    <line x1="25" y1="50" x2="145" y2="110" stroke="#0f172a" stroke-width="2"/>
    <circle cx="85" cy="80" r="4.5" fill="#d97706"/>
    <text x="92" y="74" font-family="Liberation Sans, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a">I</text>
    <text x="85" y="135" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">1 seul point commun</text>
  </g>

  <!-- Case 3: Non coplanaires (gauche) -->
  <g transform="translate(450, 45)">
    <rect width="170" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="85" y="24" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Non coplanaires</text>
    <!-- Plane representation -->
    <polygon points="20,110 90,80 150,80 80,110" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
    <line x1="25" y1="100" x2="140" y2="90" stroke="#15803d" stroke-width="2.5"/>
    <text x="145" y="93" font-family="Liberation Sans, sans-serif" font-size="10" fill="#15803d">d1</text>
    <!-- Line passing through space without touching -->
    <line x1="50" y1="35" x2="120" y2="135" stroke="#0f172a" stroke-width="2.5"/>
    <text x="123" y="140" font-family="Liberation Sans, sans-serif" font-size="10" fill="#0f172a">d2</text>
    <text x="85" y="135" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Ni parallèles ni sécantes</text>
  </g>
  <text x="325" y="222" font-family="Liberation Sans, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">Dans l'espace, deux droites sans intersection ne sont pas nécessairement parallèles : elles peuvent être gauches</text>
</svg>