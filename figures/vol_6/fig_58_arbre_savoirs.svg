<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="320">
  <rect width="600" height="320" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Racine -->
  <rect x="220" y="260" width="160" height="40" rx="6" fill="#0f172a"/>
  <text x="300" y="285" font-family="Liberation Sans, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">VOL. I : L'ÂGE DU CORPS</text>
  <!-- Troncs Vol II &amp; III -->
  <rect x="110" y="180" width="170" height="40" rx="6" fill="#1d4ed8"/>
  <text x="195" y="205" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">VOL. II : LE PARTAGE</text>
  <rect x="320" y="180" width="170" height="40" rx="6" fill="#15803d"/>
  <text x="405" y="205" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">VOL. III : L'ESPACE EUCLIDIEN</text>
  <!-- Branches Vol IV &amp; V -->
  <rect x="50" y="100" width="220" height="40" rx="6" fill="#d97706"/>
  <text x="160" y="125" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">VOL. IV : L'ALCHIMIE ALGÉBRIQUE</text>
  <rect x="330" y="100" width="220" height="40" rx="6" fill="#7e22ce"/>
  <text x="440" y="125" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">VOL. V : L'INFINI &amp; LE MOUVEMENT</text>
  <!-- Sommet Vol VI -->
  <rect x="180" y="20" width="240" height="45" rx="8" fill="#b91c1c"/>
  <text x="300" y="47" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">VOL. VI : L'ÉDIFICE MODERNE</text>
  <!-- Liens hiérarchiques -->
  <line x1="300" y1="260" x2="195" y2="220" stroke="#0f172a" stroke-width="2"/>
  <line x1="300" y1="260" x2="405" y2="220" stroke="#0f172a" stroke-width="2"/>
  <line x1="195" y1="180" x2="160" y2="140" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="405" y1="180" x2="440" y2="140" stroke="#15803d" stroke-width="2"/>
  <line x1="160" y1="100" x2="270" y2="65" stroke="#d97706" stroke-width="2"/>
  <line x1="440" y1="100" x2="330" y2="65" stroke="#7e22ce" stroke-width="2"/>
</svg>