<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 260" width="100%" height="260">
  <rect width="650" height="260" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Arbre de décision combinatoire : Ordre et Répétition des choix</text>

  <!-- Root: L'ordre compte-t-il ? -->
  <rect x="235" y="45" width="180" height="34" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="325" y="67" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">L'ordre compte-t-il ?</text>

  <!-- Branches from Root -->
  <line x1="260" y1="79" x2="160" y2="110" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="195" y="92" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">OUI</text>

  <line x1="390" y1="79" x2="490" y2="110" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="450" y="92" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">NON</text>

  <!-- Left Subtree (Ordre compte) -->
  <rect x="70" y="110" width="180" height="30" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="160" y="130" font-family="Liberation Sans, sans-serif" font-size="11.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Répétition permise ?</text>

  <line x1="120" y1="140" x2="70" y2="175" stroke="#1d4ed8" stroke-width="2"/>
  <text x="80" y="158" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#1d4ed8">OUI</text>
  <rect x="15" y="175" width="115" height="42" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="72" y="193" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">p-listes</text>
  <text x="72" y="209" font-family="Liberation Sans, sans-serif" font-size="11.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">n^p</text>

  <line x1="200" y1="140" x2="245" y2="175" stroke="#1d4ed8" stroke-width="2"/>
  <text x="235" y="158" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#1d4ed8">NON</text>
  <rect x="180" y="175" width="135" height="42" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="247" y="193" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Arrangements</text>
  <text x="247" y="209" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A_n^p = n!/(n-p)!</text>

  <!-- Right Subtree (Ordre ne compte pas) -->
  <rect x="400" y="110" width="180" height="30" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="490" y="130" font-family="Liberation Sans, sans-serif" font-size="11.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">Sous-ensembles</text>

  <line x1="490" y1="140" x2="490" y2="175" stroke="#b91c1c" stroke-width="2"/>
  <rect x="410" y="175" width="160" height="42" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="490" y="193" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Combinaisons</text>
  <text x="490" y="209" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">(n p) = n! / [p!(n-p)!]</text>

  <text x="325" y="244" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Lorsque p = n dans les arrangements sans répétition, on obtient les n! permutations</text>
</svg>