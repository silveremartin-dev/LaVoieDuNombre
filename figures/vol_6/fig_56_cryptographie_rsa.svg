<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="250">
  <defs>
    <marker id="arr-dark2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="650" height="250" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="28" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Cryptographie à clé publique (RSA) : le cadenas mathématique</text>

  <!-- Alice box (left) -->
  <rect x="40" y="50" width="170" height="150" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="125" y="75" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Alice (Émettrice)</text>
  <text x="125" y="105" font-family="Liberation Sans, sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle">Message clair : M = 42</text>
  <rect x="60" y="125" width="130" height="30" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="125" y="145" font-family="Liberation Sans, sans-serif" font-size="11.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Chiffrement : C = M^e [n]</text>
  <text x="125" y="180" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Utilise la clé publique de Bob</text>

  <!-- Canal public (center) -->
  <path d="M 215 140 L 430 140" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-dark2)"/>
  <rect x="255" y="115" width="140" height="48" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="325" y="133" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Canal public non sécurisé</text>
  <text x="325" y="152" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">Message chiffré C</text>

  <!-- Bob box (right) -->
  <rect x="440" y="50" width="170" height="150" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="525" y="75" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">Bob (Destinataire)</text>
  <text x="525" y="100" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Clé publique (e, n) : ouverte</text>
  <text x="525" y="118" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">Clé privée d : secrète</text>
  <rect x="455" y="130" width="140" height="30" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
  <text x="525" y="150" font-family="Liberation Sans, sans-serif" font-size="11.5" font-weight="bold" fill="#15803d" text-anchor="middle">Déchiffrement : M = C^d [n]</text>
  <text x="525" y="185" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Message retrouvé : 42</text>

  <text x="325" y="230" font-family="Liberation Sans, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">Théorème d'Euler : d × e ≡ 1 [φ(n)] permet l'inversion sans révéler la clé secrète d</text>
</svg>