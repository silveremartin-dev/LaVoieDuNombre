<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <rect width="540" height="220" fill="#f8fafc" rx="8"/>
  <text x="270" y="28" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#0f172a">Le Choix du Sentier : Marais (10% Perte) vs Gorges (40% Perte)</text>
  
  <g transform="translate(60, 50)">
    <circle cx="20" cy="60" r="7" fill="#0f172a"/>
    <text x="20" y="85" text-anchor="middle" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#0f172a">Départ</text>
    
    <!-- Top Branch: Sentier des Marais (A) -->
    <line x1="27" y1="56" x2="160" y2="25" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="160" y="10" width="160" height="32" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5" rx="4"/>
    <text x="240" y="31" text-anchor="middle" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#1d4ed8">Sentier des Marais (A)</text>
    <text x="240" y="60" text-anchor="middle" font-family="Liberation Sans" font-size="11" fill="#475569">1 caravane sur 10 perdue (10 %)</text>
    
    <line x1="320" y1="25" x2="400" y2="60" stroke="#1d4ed8" stroke-width="2.5"/>
    
    <!-- Bottom Branch: Sentier des Gorges (B) -->
    <line x1="27" y1="64" x2="160" y2="95" stroke="#b91c1c" stroke-width="2.5"/>
    <rect x="160" y="80" width="160" height="32" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" rx="4"/>
    <text x="240" y="101" text-anchor="middle" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#b91c1c">Sentier des Gorges (B)</text>
    <text x="240" y="130" text-anchor="middle" font-family="Liberation Sans" font-size="11" fill="#475569">4 caravanes sur 10 perdues (40 %)</text>
    
    <line x1="320" y1="95" x2="400" y2="60" stroke="#b91c1c" stroke-width="2.5"/>
    
    <!-- Destination -->
    <circle cx="400" cy="60" r="7" fill="#15803d"/>
    <text x="400" y="85" text-anchor="middle" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#15803d">Oasis de Jade</text>
  </g>
</svg>