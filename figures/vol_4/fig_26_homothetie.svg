<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 240" width="100%" height="240">
  <rect width="650" height="240" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">L'homothétie : agrandissement et réduction de centre O et de rapport k</text>

  <g transform="translate(100, 45)">
    <!-- Center O -->
    <circle cx="30" cy="110" r="5" fill="#d97706" stroke="#0f172a" stroke-width="2"/>
    <text x="15" y="115" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">O</text>

    <!-- Rays from O through vertices -->
    <line x1="30" y1="110" x2="390" y2="40" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="30" y1="110" x2="410" y2="155" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="30" y1="110" x2="330" y2="155" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- Original small triangle (k = 1) -->
    <polygon points="120,92 140,121 100,121" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="120" y="115" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">F</text>
    <text x="120" y="137" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#1d4ed8" text-anchor="middle">Original</text>

    <!-- Scaled triangle (k = 2.5) -->
    <polygon points="255,65 305,138 205,138" fill="#fef2f2" fill-opacity="0.6" stroke="#b91c1c" stroke-width="3"/>
    <text x="255" y="115" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">F'</text>
    <text x="255" y="155" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">Agrandie (k = 2)</text>
  </g>

  <!-- Side info card -->
  <g transform="translate(470, 55)" font-family="Liberation Sans, sans-serif">
    <rect width="150" height="115" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="75" y="24" font-size="11.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Règles d'échelle :</text>
    <text x="15" y="52" font-size="11" fill="#1d4ed8">• Longueurs × k</text>
    <text x="15" y="77" font-size="11" fill="#b91c1c">• Aires × k²</text>
    <text x="15" y="102" font-size="11" fill="#15803d">• Volumes × k³</text>
  </g>

  <text x="325" y="222" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Si les longueurs doublent (k = 2), l'aire du triangle est multipliée par 4 (2² = 4)</text>
</svg>