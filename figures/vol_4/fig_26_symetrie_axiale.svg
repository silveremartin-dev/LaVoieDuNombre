<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="250">
  <rect width="650" height="250" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">La symétrie axiale : la droite (d) est la médiatrice du segment [MM']</text>

  <g transform="translate(180, 45)">
    <!-- Axis of symmetry (d) -->
    <line x1="140" y1="10" x2="140" y2="170" stroke="#b91c1c" stroke-width="3"/>
    <text x="148" y="25" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">Axe (d)</text>

    <!-- Point M (left) -->
    <circle cx="40" cy="90" r="5" fill="#1d4ed8"/>
    <text x="25" y="88" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">M</text>

    <!-- Point M' (right) -->
    <circle cx="240" cy="90" r="5" fill="#1d4ed8"/>
    <text x="250" y="88" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">M'</text>

    <!-- Segment [MM'] -->
    <line x1="40" y1="90" x2="240" y2="90" stroke="#0f172a" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Midpoint I on axis (d) -->
    <circle cx="140" cy="90" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <text x="145" y="108" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">I</text>

    <!-- Right angle mark at I -->
    <rect x="126" y="76" width="14" height="14" fill="none" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Equality ticks on MI and IM' -->
    <line x1="88" y1="84" x2="92" y2="96" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="93" y1="84" x2="97" y2="96" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="188" y1="84" x2="192" y2="96" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="193" y1="84" x2="197" y2="96" stroke="#1d4ed8" stroke-width="2"/>
  </g>

  <!-- Side info card -->
  <g transform="translate(480, 60)" font-family="Liberation Sans, sans-serif">
    <rect width="140" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="70" y="24" font-size="11.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Deux propriétés :</text>
    <text x="12" y="55" font-size="11" fill="#1d4ed8">1. (d) ⊥ [MM']</text>
    <text x="12" y="85" font-size="11" fill="#1d4ed8">2. MI = IM'</text>
    <text x="70" y="102" font-size="9.5" fill="#64748b" text-anchor="middle">(I milieu de [MM'])</text>
  </g>

  <text x="325" y="235" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Un pliage le long de la droite (d) amène exactement le point M en coïncidence avec le point M'</text>
</svg>