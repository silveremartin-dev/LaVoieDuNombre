<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="100%" height="100%">
  <rect width="540" height="260" fill="#f8fafc" rx="8"/>
  <text x="270" y="28" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#0f172a">Preuve Géométrique : a² − b² = (a − b)(a + b)</text>
  
  <g transform="translate(60, 60)">
    <!-- Big square a x a minus small square b x b -->
    <rect x="0" y="0" width="110" height="110" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="55" y="60" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#1d4ed8">(a − b)²</text>
    
    <rect x="110" y="0" width="40" height="110" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="130" y="60" text-anchor="middle" font-family="Liberation Sans" font-size="11" font-weight="bold" fill="#15803d">b(a-b)</text>
    
    <rect x="0" y="110" width="110" height="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="55" y="135" text-anchor="middle" font-family="Liberation Sans" font-size="11" font-weight="bold" fill="#d97706">b(a-b)</text>
    
    <rect x="110" y="110" width="40" height="40" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,3"/>
    <text x="130" y="135" text-anchor="middle" font-family="Liberation Sans" font-size="11" fill="#b91c1c">b² ôté</text>
  </g>
  
  <text x="260" y="140" font-family="Liberation Sans" font-size="20" font-weight="bold" fill="#0f172a">═</text>
  
  <!-- Reassembled rectangle (a-b) x (a+b) -->
  <g transform="translate(300, 85)">
    <rect x="0" y="0" width="190" height="70" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="120" y1="0" x2="120" y2="70" stroke="#475569" stroke-dasharray="4,4"/>
    <text x="60" y="40" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#1d4ed8">Partie a</text>
    <text x="155" y="40" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#15803d">Partie b</text>
    
    <!-- Dimension labels -->
    <text x="95" y="-8" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#0f172a">Longueur = a + b</text>
    <text x="-12" y="40" text-anchor="end" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#0f172a">a − b</text>
  </g>
  <text x="270" y="240" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#0f172a">Les deux morceaux restants se recollent en un grand rectangle de dimensions (a − b) × (a + b).</text>
</svg>