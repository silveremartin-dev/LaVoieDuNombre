<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 220" width="100%" height="220">
  <defs>
    <marker id="arr-dark11" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="650" height="220" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Représentation d'un intervalle sur la droite réelle : I = [a, b[</text>

  <g transform="translate(60, 45)">
    <!-- Real line -->
    <line x1="20" y1="75" x2="510" y2="75" stroke="#0f172a" stroke-width="2" marker-end="url(#arr-dark11)"/>
    <text x="505" y="95" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">x</text>

    <!-- Shaded interval segment [120, 360] -->
    <rect x="140" y="65" width="220" height="20" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="250" y="79" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">a ≤ x &lt; b</text>

    <!-- Bracket closed at a (point x = 140) -->
    <!-- [ symbol -->
    <path d="M 148 55 L 140 55 L 140 95 L 148 95" fill="none" stroke="#1d4ed8" stroke-width="3.5"/>
    <circle cx="140" cy="75" r="4.5" fill="#1d4ed8"/>
    <text x="140" y="115" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">a (inclus)</text>

    <!-- Bracket open at b (point x = 360) -->
    <!-- [ symbol turned right means excluded -->
    <path d="M 352 55 L 360 55 L 360 95 L 352 95" fill="none" stroke="#b91c1c" stroke-width="3.5"/>
    <circle cx="360" cy="75" r="4.5" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="360" y="115" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">b (exclu)</text>
  </g>

  <!-- Summary note -->
  <text x="325" y="185" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Le crochet tourné vers l'intérieur englobe la valeur ; tourné vers l'extérieur, il l'exclut</text>
  <text x="325" y="202" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Exemple : x ∈ [-2 ; 5[ équivaut à la double inégalité -2 ≤ x &lt; 5</text>
</svg>