<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <rect width="500" height="280" fill="#f8fafc" rx="8"/>
  <text x="250" y="28" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#0f172a">Preuve Géométrique : (a + b)(c + d) = ac + ad + bc + bd</text>
  
  <g transform="translate(130, 60)">
    <!-- Rectangle ac -->
    <rect x="0" y="0" width="140" height="90" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="70" y="50" text-anchor="middle" font-family="Liberation Sans" font-size="16" font-weight="bold" fill="#1d4ed8">a × c</text>
    
    <!-- Rectangle bc -->
    <rect x="140" y="0" width="100" height="90" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="190" y="50" text-anchor="middle" font-family="Liberation Sans" font-size="16" font-weight="bold" fill="#d97706">b × c</text>
    
    <!-- Rectangle ad -->
    <rect x="0" y="90" width="140" height="70" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="70" y="130" text-anchor="middle" font-family="Liberation Sans" font-size="16" font-weight="bold" fill="#15803d">a × d</text>
    
    <!-- Rectangle bd -->
    <rect x="140" y="90" width="100" height="70" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="190" y="130" text-anchor="middle" font-family="Liberation Sans" font-size="16" font-weight="bold" fill="#b91c1c">b × d</text>
    
    <!-- Boundary labels -->
    <text x="70" y="-10" text-anchor="middle" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#0f172a">a</text>
    <text x="190" y="-10" text-anchor="middle" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#0f172a">b</text>
    <text x="-15" y="50" text-anchor="middle" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#0f172a">c</text>
    <text x="-15" y="130" text-anchor="middle" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#0f172a">d</text>
  </g>
  <text x="250" y="260" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#0f172a">L'aire totale est la somme exacte des aires des quatre sous-rectangles.</text>
</svg>