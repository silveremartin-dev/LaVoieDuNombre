<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="250">
  <rect width="650" height="250" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">La corde à 13 nœuds des bâtisseurs : 3² + 4² = 5² fabrique un angle droit parfait</text>

  <g transform="translate(180, 45)">
    <!-- Triangle 3-4-5 (side 1 = 120, side 2 = 90, hyp = 150) -->
    <!-- Base (4 units: 160px) -->
    <line x1="40" y1="150" x2="200" y2="150" stroke="#1d4ed8" stroke-width="3.5"/>
    <text x="120" y="170" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">4 intervalles (Base)</text>

    <!-- Vertical (3 units: 120px) -->
    <line x1="40" y1="150" x2="40" y2="30" stroke="#b91c1c" stroke-width="3.5"/>
    <text x="15" y="95" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">3 int.</text>

    <!-- Hypotenuse (5 units: 200px) -->
    <line x1="40" y1="30" x2="200" y2="150" stroke="#15803d" stroke-width="3.5"/>
    <text x="135" y="80" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#15803d">5 intervalles (Hypoténuse)</text>

    <!-- Right angle mark -->
    <rect x="40" y="136" width="14" height="14" fill="none" stroke="#0f172a" stroke-width="2"/>

    <!-- The 13 Knots (nodes) -->
    <!-- Corner right angle: knot 1 -->
    <circle cx="40" cy="150" r="4.5" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <!-- On vertical: knots 2, 3, 4 (corner top) -->
    <circle cx="40" cy="110" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="40" cy="70" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="40" cy="30" r="4.5" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <!-- On hypotenuse: knots 5, 6, 7, 8, 9 (corner bottom right) -->
    <circle cx="72" cy="54" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="104" cy="78" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="136" cy="102" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="168" cy="126" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="200" cy="150" r="4.5" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <!-- On base: knots 10, 11, 12, (knot 13 coincides with knot 1 to close loop) -->
    <circle cx="160" cy="150" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="120" cy="150" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="80" cy="150" r="4" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
  </g>

  <!-- Formula box -->
  <g transform="translate(430, 60)" font-family="Liberation Sans, sans-serif">
    <rect width="180" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="90" y="24" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Réciproque de Pythagore</text>
    <text x="20" y="55" font-size="12" fill="#0f172a">3² + 4² = 9 + 16 = 25</text>
    <text x="20" y="80" font-size="12" fill="#15803d">5² = 25</text>
    <text x="90" y="102" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">Angle droit vérifié !</text>
  </g>

  <text x="325" y="235" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">13 nœuds régulièrement espacés délimitent exactement 12 intervalles (3 + 4 + 5 = 12)</text>
</svg>