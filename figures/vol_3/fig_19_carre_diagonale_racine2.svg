<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 280" width="100%" height="100%">
  <rect width="450" height="280" fill="#f8fafc" rx="8"/>
  <text x="225" y="28" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#0f172a">Le Carré Unité et la Diagonale Incommensurable √2</text>
  
  <g transform="translate(135, 60)">
    <rect x="0" y="0" width="180" height="180" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <line x1="0" y1="180" x2="180" y2="0" stroke="#b91c1c" stroke-width="3"/>
    
    <!-- Labels -->
    <text x="90" y="-10" text-anchor="middle" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#1d4ed8">1 m</text>
    <text x="90" y="200" text-anchor="middle" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#1d4ed8">1 m</text>
    <text x="-15" y="95" text-anchor="middle" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#1d4ed8">1 m</text>
    <text x="195" y="95" text-anchor="middle" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#1d4ed8">1 m</text>
    
    <!-- Diagonal Label -->
    <text x="75" y="85" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#b91c1c">d = √2 ≈ 1,414 m</text>
    
    <!-- Right angle mark -->
    <rect x="0" y="165" width="15" height="15" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  </g>
  <text x="225" y="265" text-anchor="middle" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#0f172a">Théorème de Pythagore : d² = 1² + 1² = 2  ⟹  d = √2 (Nombre irrationnel)</text>
</svg>