<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 250" width="100%" height="250">
  <defs>
    <marker id="arr-dark13" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="650" height="250" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="325" y="26" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Distance entre deux points : AB = √[(xB - xA)² + (yB - yA)²]</text>

  <g transform="translate(100, 45)">
    <!-- Axes -->
    <line x1="20" y1="150" x2="380" y2="150" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr-dark13)"/>
    <text x="375" y="165" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">x</text>
    <line x1="50" y1="170" x2="50" y2="20" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr-dark13)"/>
    <text x="38" y="22" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">y</text>

    <!-- Point A(xA, yA) at x = 110, y = 110 -->
    <circle cx="110" cy="110" r="5" fill="#1d4ed8"/>
    <text x="80" y="105" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">A(xA, yA)</text>
    <line x1="110" y1="110" x2="110" y2="150" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="110" y="165" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle">xA</text>
    <line x1="50" y1="110" x2="110" y2="110" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="35" y="113" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#0f172a">yA</text>

    <!-- Point B(xB, yB) at x = 290, y = 40 -->
    <circle cx="290" cy="40" r="5" fill="#b91c1c"/>
    <text x="298" y="42" font-family="Liberation Sans, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">B(xB, yB)</text>
    <line x1="290" y1="40" x2="290" y2="150" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="290" y="165" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle">xB</text>
    <line x1="50" y1="40" x2="290" y2="40" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="35" y="43" font-family="Liberation Sans, sans-serif" font-size="10.5" fill="#0f172a">yB</text>

    <!-- Segment AB (Hypotenuse) -->
    <line x1="110" y1="110" x2="290" y2="40" stroke="#15803d" stroke-width="3.5"/>
    <text x="190" y="65" font-family="Liberation Sans, sans-serif" font-size="13" font-weight="bold" fill="#15803d">Distance AB</text>

    <!-- Right triangle legs -->
    <line x1="110" y1="110" x2="290" y2="110" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="200" y="126" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">Δx = xB - xA</text>

    <line x1="290" y1="110" x2="290" y2="40" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="298" y="80" font-family="Liberation Sans, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">Δy = yB - yA</text>

    <!-- Right angle square at C(290, 110) -->
    <rect x="276" y="96" width="14" height="14" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="290" cy="110" r="3.5" fill="#0f172a"/>
    <text x="298" y="115" font-family="Liberation Sans, sans-serif" font-size="10" fill="#0f172a">C</text>
  </g>

  <!-- Side summary card -->
  <g transform="translate(450, 65)" font-family="Liberation Sans, sans-serif">
    <rect width="165" height="100" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="82" y="24" font-size="11.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Pythagore dans le plan :</text>
    <text x="15" y="52" font-size="11" fill="#1d4ed8">• Base² = (xB - xA)²</text>
    <text x="15" y="72" font-size="11" fill="#b91c1c">• Hauteur² = (yB - yA)²</text>
    <text x="15" y="92" font-size="11" font-weight="bold" fill="#15803d">• AB² = Base² + Hauteur²</text>
  </g>

  <text x="325" y="235" font-family="Liberation Sans, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">La formule de distance cartésienne est la transposition directe du théorème de Pythagore dans les coordonnées du plan</text>
</svg>