<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="100%" height="140">
  <rect width="560" height="140" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Axe horizontal -->
  <line x1="40" y1="70" x2="520" y2="70" stroke="#0f172a" stroke-width="2"/>
  <polygon points="525,70 515,66 515,74" fill="#0f172a"/>
  <!-- Graduations de 0 à 2 par pas de 1/4 -->
<line x1="50" y1="60" x2="50" y2="80" stroke="#0f172a" stroke-width="2.5"/>
<text x="50" y="98" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">0</text>
<line x1="105" y1="64" x2="105" y2="76" stroke="#0f172a" stroke-width="1.5"/>
<text x="105" y="98" font-family="Liberation Sans" font-size="10" font-weight="normal" fill="#0f172a" text-anchor="middle">1/4</text>
<line x1="160" y1="64" x2="160" y2="76" stroke="#0f172a" stroke-width="1.5"/>
<text x="160" y="98" font-family="Liberation Sans" font-size="10" font-weight="normal" fill="#0f172a" text-anchor="middle">2/4</text>
<line x1="215" y1="64" x2="215" y2="76" stroke="#0f172a" stroke-width="1.5"/>
<text x="215" y="98" font-family="Liberation Sans" font-size="10" font-weight="normal" fill="#0f172a" text-anchor="middle">3/4</text>
<line x1="270" y1="60" x2="270" y2="80" stroke="#0f172a" stroke-width="2.5"/>
<text x="270" y="98" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">1</text>
<line x1="325" y1="64" x2="325" y2="76" stroke="#0f172a" stroke-width="1.5"/>
<text x="325" y="98" font-family="Liberation Sans" font-size="10" font-weight="normal" fill="#0f172a" text-anchor="middle">5/4</text>
<line x1="380" y1="64" x2="380" y2="76" stroke="#0f172a" stroke-width="1.5"/>
<text x="380" y="98" font-family="Liberation Sans" font-size="10" font-weight="normal" fill="#0f172a" text-anchor="middle">6/4</text>
<line x1="435" y1="64" x2="435" y2="76" stroke="#0f172a" stroke-width="1.5"/>
<text x="435" y="98" font-family="Liberation Sans" font-size="10" font-weight="normal" fill="#0f172a" text-anchor="middle">7/4</text>
<line x1="490" y1="60" x2="490" y2="80" stroke="#0f172a" stroke-width="2.5"/>
<text x="490" y="98" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">2</text>
  <!-- Point A (1/4), B (1 = 4/4), C (7/4) -->
  <circle cx="105" cy="70" r="5" fill="#1d4ed8"/>
  <text x="105" y="50" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A (1/4)</text>
  <circle cx="270" cy="70" r="5" fill="#15803d"/>
  <text x="270" y="50" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">B (1 = 4/4)</text>
  <circle cx="435" cy="70" r="5" fill="#b91c1c"/>
  <text x="435" y="50" font-family="Liberation Sans" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">C (7/4)</text>
</svg>