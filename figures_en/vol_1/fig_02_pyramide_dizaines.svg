<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="200">
  <rect width="600" height="200" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="24" font-family="Liberation Sans, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">The Decimal Pyramid: Groupings in Bundles of Ten</text>
  
  <g transform="translate(40, 42)" font-family="Liberation Sans, sans-serif" font-size="12">
    <!-- Row 1: Unit -->
    <rect x="0" y="0" width="520" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="20" cy="15" r="7" fill="#64748b"/>
    <text x="40" y="19" font-weight="bold" fill="#0f172a">1 gray pebble</text>
    <text x="190" y="19" fill="#15803d">= 1 unit</text>
    <text x="480" y="19" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1</text>
    
    <!-- Row 2: Ten -->
    <rect x="0" y="36" width="520" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <rect x="12" y="44" width="16" height="14" rx="2" fill="#d97706"/>
    <text x="40" y="55" font-weight="bold" fill="#0f172a">1 cork stopper</text>
    <text x="190" y="55" fill="#15803d">= 1 ten (10 units)</text>
    <text x="480" y="55" font-weight="bold" fill="#1d4ed8" text-anchor="middle">10</text>
    
    <!-- Row 3: Hundred -->
    <rect x="0" y="72" width="520" height="30" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <polygon points="20,77 13,91 27,91" fill="#15803d"/>
    <text x="40" y="91" font-weight="bold" fill="#0f172a">1 pine cone</text>
    <text x="190" y="91" fill="#15803d">= 1 hundred (10 tens)</text>
    <text x="480" y="91" font-weight="bold" fill="#1d4ed8" text-anchor="middle">100</text>
    
    <!-- Row 4: Thousand -->
    <rect x="0" y="108" width="520" height="30" rx="4" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
    <circle cx="20" cy="123" r="9" fill="#7e22ce"/>
    <text x="40" y="127" font-weight="bold" fill="#0f172a">1 large polished pebble</text>
    <text x="190" y="127" fill="#15803d">= 1 thousand (10 hundreds)</text>
    <text x="480" y="127" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1 000</text>
  </g>
  <text x="300" y="188" font-family="Liberation Sans, sans-serif" font-size="11" font-style="italic" fill="#475569" text-anchor="middle">Each step upward multiplies the exact value by 10</text>
</svg>
