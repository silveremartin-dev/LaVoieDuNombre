<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 170" width="100%" height="170">
  <rect width="500" height="170" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="250" y="28" font-family="Liberation Sans, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">THF TWO-COMPARTMFNT COUNTING BOX</text>
  <g transform="translate(70, 45)">
    <rect x="0" y="0" width="180" height="90" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="4"/>
    <text x="90" y="30" font-family="Liberation Sans, sans-serif" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">TFNS (T)</text>
    <text x="90" y="60" font-family="Liberation Sans, sans-serif" font-size="12" fill="#475569" text-anchor="middle">[ Cork stoppers ]</text>
    
    <rect x="180" y="0" width="180" height="90" fill="#f0fdf4" stroke="#15803d" stroke-width="2" rx="4"/>
    <text x="270" y="30" font-family="Liberation Sans, sans-serif" font-size="15" font-weight="bold" fill="#15803d" text-anchor="middle">UNITS (U)</text>
    <text x="270" y="60" font-family="Liberation Sans, sans-serif" font-size="12" fill="#475569" text-anchor="middle">[ Small pebbles ]</text>
  </g>
  <text x="250" y="155" font-family="Liberation Sans, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Never mix corks and pebbles in the same compartment</text>
</svg>