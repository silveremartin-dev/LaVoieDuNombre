<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170" width="100%" height="170">
  <rect width="460" height="170" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <g transform="translate(60, 30)">
    <text x="50" y="-10" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">A</text>
    <text x="110" y="-10" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">B</text>
    <text x="170" y="-10" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">C</text>
    <text x="8" y="30" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#1d4ed8">2</text>
    <text x="8" y="75" font-family="Liberation Sans" font-size="13" font-weight="bold" fill="#1d4ed8">1</text>
    
    <rect x="20" y="0" width="180" height="90" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <line x1="80" y1="0" x2="80" y2="90" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="140" y1="0" x2="140" y2="90" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="20" y1="45" x2="200" y2="45" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Pomme (B, 2) -->
    <g transform="translate(110, 22)">
      <circle cx="0" cy="0" r="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
      <text x="0" y="4" font-family="Liberation Sans, sans-serif" font-size="9" font-weight="bold" fill="#b91c1c" text-anchor="middle">Apple</text>
    </g>
    <!-- Banane (A, 1) -->
    <g transform="translate(50, 67)">
      <circle cx="0" cy="0" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="0" y="4" font-family="Liberation Sans, sans-serif" font-size="9" font-weight="bold" fill="#d97706" text-anchor="middle">Banana</text>
    </g>
    <!-- Raisin (C, 1) -->
    <g transform="translate(170, 67)">
      <circle cx="0" cy="0" r="14" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
      <text x="0" y="4" font-family="Liberation Sans, sans-serif" font-size="9" font-weight="bold" fill="#7e22ce" text-anchor="middle">Grapes</text>
    </g>
  </g>
  <g transform="translate(280, 50)" font-family="Liberation Sans" font-size="12">
    <text x="0" y="15" fill="#b91c1c" font-weight="bold">🍎 Apple: (B, 2)</text>
    <text x="0" y="40" fill="#d97706" font-weight="bold">🍌 Banana: (A, 1)</text>
    <text x="0" y="65" fill="#7e22ce" font-weight="bold">🍇 Grapes: (C, 1)</text>
  </g>
</svg>