  <circle cx="390" cy="65" r="5.5" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <text x="390" y="105" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">60</text>
  
  <!-- 70 -->
  <line x1="447" y1="48" x2="447" y2="82" stroke="#0f172a" stroke-width="3"/>
  <circle cx="447" cy="65" r="5.5" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <text x="447" y="105" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">70</text>
  
  <!-- 80 -->
  <line x1="504" y1="48" x2="504" y2="82" stroke="#0f172a" stroke-width="3"/>
