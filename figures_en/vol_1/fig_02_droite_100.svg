  <!-- 90 -->
  <line x1="561" y1="48" x2="561" y2="82" stroke="#0f172a" stroke-width="3"/>
  <circle cx="561" cy="65" r="5.5" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <text x="561" y="105" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">90</text>
  
  <!-- 100 -->
  <line x1="618" y1="48" x2="618" y2="82" stroke="#0f172a" stroke-width="3"/>
  <circle cx="618" cy="65" r="5.5" fill="#15803d" stroke="#ffffff" stroke-width="2"/>
  <text x="618" y="105" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="17" font-weight="bold" fill="#15803d">100</text>
