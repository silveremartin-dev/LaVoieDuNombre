<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 130" width="100%" height="130">
  <rect width="700" height="130" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="10"/>
  
  <!-- Main Axis Line -->
  <line x1="35" y1="65" x2="655" y2="65" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Right Arrowhead -->
  <polygon points="665,65 648,56 648,74" fill="#1d4ed8"/>
  
  <!-- Minor 5-graduations -->
  <line x1="77" y1="56" x2="77" y2="74" stroke="#64748b" stroke-width="2"/>
  <line x1="134" y1="56" x2="134" y2="74" stroke="#64748b" stroke-width="2"/>
  <line x1="191" y1="56" x2="191" y2="74" stroke="#64748b" stroke-width="2"/>
  <line x1="248" y1="56" x2="248" y2="74" stroke="#64748b" stroke-width="2"/>
  <line x1="305" y1="56" x2="305" y2="74" stroke="#64748b" stroke-width="2"/>
  <line x1="362" y1="56" x2="362" y2="74" stroke="#64748b" stroke-width="2"/>
  <line x1="419" y1="56" x2="419" y2="74" stroke="#64748b" stroke-width="2"/>
  <line x1="476" y1="56" x2="476" y2="74" stroke="#64748b" stroke-width="2"/>
  <line x1="533" y1="56" x2="533" y2="74" stroke="#64748b" stroke-width="2"/>
  <line x1="590" y1="56" x2="590" y2="74" stroke="#64748b" stroke-width="2"/>
  
  <!-- Major 10-graduations with prominent Byrne-style markers -->
  <!-- 0 -->
  <line x1="48" y1="48" x2="48" y2="82" stroke="#0f172a" stroke-width="3"/>
  <circle cx="48" cy="65" r="5.5" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <text x="48" y="105" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">0</text>
  
  <!-- 10 -->
  <line x1="105" y1="48" x2="105" y2="82" stroke="#0f172a" stroke-width="3"/>
  <circle cx="105" cy="65" r="5.5" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <text x="105" y="105" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">10</text>
  
  <!-- 20 -->
  <line x1="162" y1="48" x2="162" y2="82" stroke="#0f172a" stroke-width="3"/>
  <circle cx="162" cy="65" r="5.5" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <text x="162" y="105" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">20</text>
  
  <!-- 30 -->
  <line x1="219" y1="48" x2="219" y2="82" stroke="#0f172a" stroke-width="3"/>
  <circle cx="219" cy="65" r="5.5" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <text x="219" y="105" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">30</text>
  
  <!-- 40 -->
  <line x1="276" y1="48" x2="276" y2="82" stroke="#0f172a" stroke-width="3"/>
  <circle cx="276" cy="65" r="5.5" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
  <text x="276" y="105" text-anchor="middle" font-family="Liberation Sans, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">40</text>
  
  <!-- 50 -->
  <line x1="333" y1="48" x2="333" y2="82" stroke="#0f172a" stroke-width="3"/>
  <circle cx="333" cy="65" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
