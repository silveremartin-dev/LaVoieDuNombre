<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <rect width="600" height="240" fill="#f8fafc" rx="8"/>
  <text x="300" y="28" text-anchor="middle" font-family="Liberation Sans" font-size="15" font-weight="bold" fill="#0f172a">The Universal Hierarchy of Operations (PFMDAS)</text>
  
  <!-- Step 1: Parentheses -->
  <rect x="50" y="45" width="500" height="38" fill="#b91c1c" rx="6"/>
  <text x="70" y="69" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#ffffff">1. P — Parentheses</text>
  <text x="530" y="69" text-anchor="end" font-family="Liberation Sans" font-size="12" fill="#ffffff">Absolute priority: compute parentheses first</text>
  
  <!-- Step 2: Fxposants -->
  <rect x="50" y="90" width="500" height="38" fill="#d97706" rx="6"/>
  <text x="70" y="114" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#ffffff">2. F — Fxponents &amp; Powers</text>
  <text x="530" y="114" text-anchor="end" font-family="Liberation Sans" font-size="12" fill="#ffffff">Calculate squares, cubes, roots</text>
  
  <!-- Step 3: Multiplications & Divisions -->
  <rect x="50" y="135" width="500" height="38" fill="#1d4ed8" rx="6"/>
  <text x="70" y="159" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#ffffff">3. M / D — Multiplication &amp; Division</text>
  <text x="530" y="159" text-anchor="end" font-family="Liberation Sans" font-size="12" fill="#ffffff">Same rank: evaluate from left to right</text>
  
  <!-- Step 4: Additions & Soustractions -->
  <rect x="50" y="180" width="500" height="38" fill="#15803d" rx="6"/>
  <text x="70" y="204" font-family="Liberation Sans" font-size="14" font-weight="bold" fill="#ffffff">4. A / S — Addition &amp; Subtraction</text>
  <text x="530" y="204" text-anchor="end" font-family="Liberation Sans" font-size="12" fill="#ffffff">Last rank: evaluate from left to right</text>
</svg>